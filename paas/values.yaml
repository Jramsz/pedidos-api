appName: "pedidos"

image:
  repository: "pedidos-node"
  tag: "1.0"

replicaCount: 1

env:
  NODE_ENV: "production"
  PORT: "3000"
  DB_POOL_MAX: "5"

subdomain: "pedidos"

containerPort: 3000

database: true

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPU: 70
  porTrafico: true
